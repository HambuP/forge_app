<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
  <title>FORGE</title>
  <meta name="description" content="Construye la identidad que quieres ser, un hábito a la vez."/>

  <!-- PWA -->
  <link rel="manifest" href="/manifest.webmanifest"/>
  <meta name="theme-color" content="#0F0F0E"/>
  <meta name="color-scheme" content="dark"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="FORGE"/>
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg"/>
  <link rel="apple-touch-icon" href="/icons/icon-192.png"/>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>

  <style>
    html, body, #root { height: 100%; margin: 0; }
    html { background: #0F0F0E; }
    body {
      font-family: "Inter", -apple-system, system-ui, sans-serif;
      background: #0F0F0E;
      color: #ECEBE5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: contain;
    }
    *, *::before, *::after { box-sizing: border-box; }
    button { font-family: inherit; }
    input, textarea { font-family: inherit; -webkit-appearance: none; appearance: none; }
    /* No bouncy scroll past app edges */
    #root {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      min-height: 100dvh;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/dexie@4.0.7/dist/dexie.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>

  <!-- Vercel Web Analytics (static site mode) -->
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <div id="root"></div>

  <!-- Order matters: db & logic first, components second, app last -->
  <script src="/db.js"></script>
  <script src="/logic.js"></script>
  <script type="text/babel" src="/components.jsx" data-presets="react"></script>
  <script type="text/babel" src="/app.jsx" data-presets="react"></script>

  <!-- Register service worker (only on https or localhost) -->
  <script>
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch((err) => console.warn('SW registration failed', err));
      });
    }
  </script>
</body>
</html>
